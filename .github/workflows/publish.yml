name: Publikovat web

on:
  repository_dispatch:
    types: [publish]
  workflow_dispatch:
    inputs:
      client:
        description: "Id klienta z řídicí tabulky, nebo all pro všechny"
        required: true
        default: all

concurrency:
  group: publish-${{ github.event.client_payload.client || github.event.client_payload.sheet || inputs.client }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      CONTROL_SHEET_ID: ${{ secrets.CONTROL_SHEET_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ github.event.client_payload.client || inputs.client }}
      SHEET: ${{ github.event.client_payload.sheet }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: .cache
          key: media-${{ env.TARGET || env.SHEET }}-${{ github.run_id }}
          restore-keys: |
            media-${{ env.TARGET || env.SHEET }}-
            media-
      - name: Publikovat
        run: |
          if [ -n "$SHEET" ]; then
            node src/cli.js publish --sheet "$SHEET"
          elif [ "$TARGET" = "all" ] || [ -z "$TARGET" ]; then
            node src/cli.js publish --all
          else
            node src/cli.js publish --client "$TARGET"
          fi
